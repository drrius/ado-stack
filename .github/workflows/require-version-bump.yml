name: require-version-bump

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disable Git CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch main
        run: git fetch --depth=1 origin main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Require a greater package.json version
        run: bun run scripts/require-version-bump.ts --base origin/main

  revalidate-open-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Re-run version checks against the new main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches="$(gh pr list --base main --state open --json headRefName --jq '.[].headRefName')"
          if [[ -z "${branches}" ]]; then
            echo "No open pull requests targeting main."
            exit 0
          fi
          while IFS= read -r branch; do
            run_id="$(
              gh run list \
                --workflow require-version-bump.yml \
                --event pull_request \
                --branch "${branch}" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -z "${run_id}" ]]; then
              echo "No require-version-bump run for ${branch}."
              continue
            fi
            echo "Re-running ${run_id} for ${branch}."
            gh run rerun "${run_id}"
          done <<< "${branches}"
